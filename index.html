<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar">
        <h5>Clients</h5>
        <ul>
            <li>Abdullah</li>
            <li>Anas</li>
            <li>Shivam</li>
            <li>Aditya</li>
            <li>Vipul</li>
            <li>Kunal</li>
        </ul>
    </div>

    <div id="dashboard">
        <h3>User</h3>
        <table>
            <caption>Income / Expense</caption>
            <tr>
                <th>Sr. No.</th> <!-- Serial Number -->
                <th>Date</th> <!-- Date of transation -->
                <th>Category</th> <!-- Type of item eg. food, intrest, moives etc -->
                <th>Name</th> <!-- The product item that should be recorded -->
                <th>Type</th> <!-- Expense/income -->
                <th>Amount (Rs.)</th> <!-- Amount of the transation -->
            </tr>
        </table>

        <canvas id="piechart"></canvas>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
    <script src="script.js" type="text/javascript"></script>
</body>
</html>
